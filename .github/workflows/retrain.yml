name: Retrain

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Start the database
        run: docker compose up -d --wait db
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Use data up to a week ago
        run: echo "DATA_END=$(date -u -d '7 days ago' +%F)" >> "$GITHUB_ENV"
      - name: Download the latest data
        run: python src/ingest.py
      - name: Validate
        run: python src/validate.py
      - name: Preprocess
        run: python src/preprocess.py
      - name: Build features
        run: python src/features.py
      - name: Retrain and check
        run: python src/retrain.py
      - name: Save the new models
        uses: actions/upload-artifact@v7
        with:
          name: demand-models
          path: models/
          retention-days: 30
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: github-deployer@project-559124f9-c74b-43e6-906.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Publish the new models
        run: gcloud storage cp models/model.joblib models/quantile_models.joblib models/report.json gs://project-559124f9-c74b-43e6-906-models/models/

  deploy:
    needs: retrain
    uses: ./.github/workflows/deploy.yml