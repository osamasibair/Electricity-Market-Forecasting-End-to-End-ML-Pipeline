name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      REGION: europe-west2
      IMAGE: europe-west2-docker.pkg.dev/project-559124f9-c74b-43e6-906/electricity/app:${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: github-deployer@project-559124f9-c74b-43e6-906.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Download the models
        run: gcloud storage cp -r gs://project-559124f9-c74b-43e6-906-models/models .
      - name: Build and push the image
        run: |
          gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet
          docker build -t $IMAGE .
          docker push $IMAGE
      - name: Deploy the API
        run: gcloud run deploy electricity-api --image=$IMAGE --region=$REGION
      - name: Deploy the dashboard
        run: gcloud run deploy electricity-dashboard --image=$IMAGE --region=$REGION
      - name: Check the API serves a forecast
        run: |
          url=$(gcloud run services describe electricity-api --region=$REGION --format='value(status.url)')
          curl --retry 10 --retry-all-errors --retry-delay 5 --fail --silent --show-error --output /dev/null "$url/predict?day=2026-08-26"