name: Daily forecast

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: github-deployer@project-559124f9-c74b-43e6-906.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Download the models
        run: gcloud storage cp -r gs://project-559124f9-c74b-43e6-906-models/models .
      - name: Forecast tomorrow and score earlier forecasts
        run: python src/live.py
        