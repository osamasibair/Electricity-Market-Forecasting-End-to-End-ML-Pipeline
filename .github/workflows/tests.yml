name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Start the database
        run: docker compose up -d --wait db
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Create CI fixtures
        run: PYTHONPATH=src python tests/make_test_data.py
      - name: Test with coverage
        run: pytest --cov=src --cov=api --cov-report=term-missing
      - name: Start the API and dashboard with Docker Compose
        run: docker compose up -d --build api dashboard
      - name: Check the API serves a forecast
        run: curl --retry 10 --retry-all-errors --retry-delay 2 --fail --silent --show-error --output /dev/null "http://localhost:8000/predict?day=2026-08-26"
      - name: Check the dashboard is up
        run: curl --retry 10 --retry-all-errors --retry-delay 2 --fail --silent --show-error --output /dev/null "http://localhost:8501/_stcore/health"
      